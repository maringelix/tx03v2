# L7 waypoint of the application namespace in the local lab (Istio ambient on kind). The GKE lab cannot run
# ambient (Autopilot refuses the privileged DaemonSets of ztunnel and the CNI), so the cloud runs the same
# service-mesh exercise of dx03v2 on the sidecars of the managed Cloud Service Mesh; the local twin proves the
# exercise (80/20 canary, bounded retries, ejection, identity authorization) through this waypoint.
# platform/local/install.sh applies it and labels the namespace istio.io/use-waypoint=dx03v2-waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dx03v2-waypoint
  namespace: dx03v2
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
