# ClusterIssuer lab-ca: signs the Gateway certificates with the lab CA of terraform/envs/local (the
# stand-in for an HTTPS listener certificate; in Google Cloud HTTPS on the GKE Gateway is `planned`,
# the listener is HTTP on port 80). install.sh creates the Secret lab-ca (tls.crt/tls.key) in cert-manager first.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca
