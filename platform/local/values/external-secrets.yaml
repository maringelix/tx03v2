# Local overrides on top of platform/values/external-secrets.yaml (same chart, images and digests as
# the cloud platform; the local lab pulls the archive with the same SHA256 from the HTTP repository).
# No Workload Identity Federation for GKE here: kind has no GKE metadata server, so the
# ClusterSecretStore local-secrets authenticates with the token of a service account
# (platform/local/manifests/secret-store.yaml).
# The cloud values set what Autopilot needs (limits = requests, 50m of CPU on the webhook and the
# cert controller, 100m on the controller). In kind those CPU limits throttled the webhook into
# "context deadline exceeded" (roadmap R1.10). The webhook and the cert controller drop their resources
# (null removes a key that the chart defaults), like in the local labs of tx01v2 and tx02v2. Helm keeps
# a nested null that the chart does not default (the controller would render "cpu: null"), so the
# controller gets a 1-CPU ceiling instead, which never throttles it in kind.
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    cpu: "1"
    memory: 256Mi

webhook:
  resources: null

certController:
  resources: null
