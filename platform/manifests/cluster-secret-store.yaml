# ClusterSecretStore of contract v1: Google Secret Manager through Workload Identity Federation
# for GKE. No auth block: ESO uses the identity of its controller (the ServiceAccount
# external-secrets/external-secrets, roles/secretmanager.secretAccessor on the two lab secrets
# only). platform/render-manifests.sh puts the contract key project-id into projectID. Usable from
# dx03v2 only.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  conditions:
    - namespaces:
        - dx03v2
  provider:
    gcpsm:
      projectID: __PROJECT_ID__
