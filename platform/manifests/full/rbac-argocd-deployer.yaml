# What the deploy role of dx03v2 may do in Argo CD (docs/CONTRATO.md): read the Application dx03v2 and
# ask it to refresh (an annotation), nothing else and nothing in any other Application. GKE does not
# map an arbitrary Kubernetes group without Google Groups for RBAC configuration, so bind the same
# explicit Google identities used by the dx03v2 namespace RoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dx03v2-gitops-sync
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["dx03v2"]
    verbs: ["get", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dx03v2-gitops-sync
  namespace: argocd
subjects:
__DEPLOYER_SUBJECTS__
roleRef:
  kind: Role
  name: dx03v2-gitops-sync
  apiGroup: rbac.authorization.k8s.io
