# Cloud-only image gate: API/web need exact contract Artifact Registry digests. The named Google
# mesh containers may use only the exact official managed proxy image. The local policy is unchanged.
# platform/install.sh replaces the repository with contract key artifact-registry/repository.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: LabGcpAllowedImages
metadata:
  name: allowed-repos
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
    namespaceSelector:
      matchLabels:
        policy.lab/enforce: "true"
  parameters:
    repository: "__ARTIFACT_REGISTRY_REPOSITORY__"
