# open-telemetry/opentelemetry-collector (chart OTEL_COLLECTOR_CHART_VERSION of platform/versions.env),
# namespace observability: the entry point of the traces of the lab in Google Cloud, the same Collector
# as the local lab (platform/local/values/otel-collector.yaml, same image digest). The dx03v2 API sends
# OTLP/HTTP to opentelemetry-collector.observability.svc:4318 (docs/CONTRACT.md); the Collector adds the
# Kubernetes attributes of the sender and writes the spans to Cloud Trace. Its Kubernetes ServiceAccount
# is the IAM principal itself (Workload Identity Federation for GKE, roles/cloudtrace.agent on the
# project, terraform/envs/lab/roles.tf): no Google service account, no key. platform/install.sh sets
# the project. Image pinned by digest (verified 2026-10-14).
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  digest: sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
serviceAccount:
  # IAM principal .../subject/ns/observability/sa/opentelemetry-collector (contract v2).
  name: opentelemetry-collector
presets:
  kubernetesAttributes:
    enabled: true
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
# Autopilot bills the requests (and rewrites pods without them): requests = limits for memory.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 256Mi
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    resource/lab:
      attributes:
        - key: cloud.provider
          value: gcp
          action: upsert
        - key: k8s.cluster.name
          value: tx03v2-lab
          action: upsert
  exporters:
    debug: null
    googlecloud:
      # Placeholder (policy-identifiers): platform/install.sh sets the project of the lab.
      project: tx03v2-lab-example
  service:
    pipelines:
      logs: null
      metrics: null
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource/lab, batch]
        exporters: [googlecloud]
