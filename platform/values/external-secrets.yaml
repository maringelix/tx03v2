# Static values of the external-secrets chart (namespace external-secrets). No --set is needed:
# with Workload Identity Federation for GKE the ServiceAccount external-secrets/external-secrets is
# itself the IAM principal (roles/secretmanager.secretAccessor on the two lab secrets, granted by
# terraform/envs/lab/roles.tf), so it carries no annotation and no Google service account exists.
installCRDs: true

image:
  # v2.12.0, pinned by digest (verified 2026-10-10 for tx01v2, same release). The same image
  # runs the webhook and the cert controller.
  tag: v2.12.0@sha256:7a3c4f7e038fa0f86a3172da19b9388f3f4d846e87e9994ee3474c5b72a9330d

serviceAccount:
  create: true
  # Contract: principal .../subject/ns/external-secrets/sa/external-secrets.
  name: external-secrets
  annotations: {}

# Autopilot bills the requests and rewrites requests outside its rules (minimum 50m CPU / 52 MiB,
# CPU:memory between 1:1 and 1:6.5), so every container states them; limits = requests.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 100m
    memory: 256Mi

webhook:
  image:
    tag: v2.12.0@sha256:7a3c4f7e038fa0f86a3172da19b9388f3f4d846e87e9994ee3474c5b72a9330d
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 50m
      memory: 128Mi

certController:
  image:
    tag: v2.12.0@sha256:7a3c4f7e038fa0f86a3172da19b9388f3f4d846e87e9994ee3474c5b72a9330d
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 50m
      memory: 128Mi
