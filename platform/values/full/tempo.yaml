# Persistent Disk (standard-rwo) persistence for the GKE Autopilot cloud profile; keep traces for 72 hours and remove the
# persistent volume with the lab teardown.
tempo:
  retention: 72h

persistence:
  enabled: true
  enableStatefulSetAutoDeletePVC: false
  storageClassName: standard-rwo
  accessModes:
    - ReadWriteOnce
  size: 10Gi

extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
