# Extend the core profile's Google Cloud Trace exporter with the same in-cluster Tempo and RED
# spanmetrics pipeline used by the local lab. The Google Cloud exporter remains the first destination.
ports:
  spanmetrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
      interval: 30s
    - port: spanmetrics
      interval: 10s
config:
  receivers:
    # Synthetic checks of the app from inside the cluster (the SyntheticProbeFailed alert of
    # platform/manifests/full/app-monitoring.yaml reads httpcheck_status). The Collector is outside the
    # mesh: the app admits its plaintext probes only on the health endpoints (app-security.yaml).
    httpcheck:
      collection_interval: 30s
      initial_delay: 5s
      targets:
        - endpoint: http://web.dx03v2.svc:8080/healthz
          validations:
            - json_path: $.status
              equals: ok
        - endpoint: http://api.dx03v2.svc:3000/readyz
          validations:
            - json_path: $.status
              equals: ready
      metrics:
        httpcheck.duration:
          enabled: true
        httpcheck.validation.failed:
          enabled: true
        httpcheck.validation.passed:
          enabled: true
  connectors:
    spanmetrics:
      namespace: traces.span.metrics
      metrics_flush_interval: 15s
      histogram:
        unit: s
        explicit:
          buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
      dimensions:
        - name: http.request.method
        - name: http.response.status_code
        - name: http.route
      exemplars:
        enabled: true
  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.monitoring.svc:4317
      tls:
        insecure: true
    prometheus:
      endpoint: ${env:MY_POD_IP}:8889
      enable_open_metrics: true
  service:
    pipelines:
      traces:
        exporters: [googlecloud, otlp_grpc/tempo, spanmetrics]
      metrics/spanmetrics:
        receivers: [spanmetrics]
        processors: [batch]
        exporters: [prometheus]
      metrics/httpcheck:
        receivers: [httpcheck]
        processors: [batch]
        exporters: [prometheus]
