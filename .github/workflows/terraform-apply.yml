# Applies terraform/envs/lab. CLOUD-MUTATING and billable (GKE Autopilot pods, Cloud SQL, the
# Gateway load balancer and Cloud Armor; docs/CUSTOS.md): dispatch manually, after reading the
# latest terraform-plan run. The `lab` environment (required reviewer, main only) gates the
# Workload Identity Federation subject of tx03v2-gha-apply (the immutable
# repo:<owner>@<owner id>/tx03v2@<repository id>:environment:lab). The project must be dedicated to
# the lab: scripts/preflight.sh runs first and stops at a cluster, a database or a secret of other
# work, because the roles of the apply identity cover the whole project (docs/GUARDRAILS.md, SEC-18
# and SEC-20).
# Not run in the cloud yet (v2).
name: terraform-apply

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tx03v2-lab-cloud
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_deploy_service_account: ${{ vars.LAB_DEPLOY_SERVICE_ACCOUNT }}
      # A secret, not a variable: the logs of a public repository are public, and a secret is masked.
      TF_VAR_app_deployer_members: ${{ secrets.LAB_APP_DEPLOYER_MEMBERS || '[]' }}
      TF_VAR_enable_waf: ${{ vars.LAB_ENABLE_WAF || 'true' }}
      TF_VAR_dns_zone_name: ${{ vars.LAB_DNS_ZONE_NAME || '' }}
      TF_VAR_app_domain_name: ${{ vars.LAB_APP_DOMAIN_NAME || '' }}
      TF_VAR_enable_managed_mesh: ${{ vars.LAB_ENABLE_MANAGED_MESH || 'false' }}
      TF_VAR_db_tier: ${{ vars.LAB_DB_TIER || 'db-g1-small' }}
      TF_VAR_db_profile: ${{ vars.LAB_DB_PROFILE || 'core' }}
      TF_VAR_continuity_notification_channels: ${{ vars.LAB_CONTINUITY_NOTIFICATION_CHANNELS || '[]' }}
      TF_VAR_active_region: ${{ vars.LAB_ACTIVE_REGION || 'primary' }}
      TF_VAR_ha_db_tier: ${{ vars.LAB_HA_DB_TIER || 'db-custom-1-3840' }}
      TF_VAR_db_backup_count: ${{ vars.LAB_DB_BACKUP_COUNT || 'null' }}
      TF_VAR_db_deletion_protection: ${{ vars.LAB_DB_DELETION_PROTECTION || 'false' }}
      TF_VAR_db_retain_backups_on_delete: ${{ vars.LAB_DB_RETAIN_BACKUPS_ON_DELETE || 'false' }}
      TF_VAR_dr_region: ${{ vars.LAB_DR_REGION || 'us-east1' }}
      TF_VAR_dr_nodes_subnet_cidr: ${{ vars.LAB_DR_NODES_SUBNET_CIDR || '10.40.0.0/20' }}
      TF_VAR_dr_pods_cidr: ${{ vars.LAB_DR_PODS_CIDR || '10.42.0.0/16' }}
      TF_VAR_dr_services_cidr: ${{ vars.LAB_DR_SERVICES_CIDR || '10.43.0.0/20' }}
      TF_VAR_dr_control_plane_cidr: ${{ vars.LAB_DR_CONTROL_PLANE_CIDR || '172.31.255.224/28' }}
    steps:
      - name: Check repository variables
        run: |
          problems=()
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || problems+=("GCP_PROJECT_ID must be the project ID given to the bootstrap")
          [[ "$TF_VAR_region" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || problems+=("GCP_REGION must be the region given to the bootstrap, e.g. us-central1")
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/tx03v2-github/providers/github$ ]] || problems+=("GCP_WORKLOAD_IDENTITY_PROVIDER must be the bootstrap output workload_identity_provider")
          [[ "$GCP_SERVICE_ACCOUNT" == "tx03v2-gha-apply@$GCP_PROJECT_ID.iam.gserviceaccount.com" ]] || problems+=("GCP_APPLY_SERVICE_ACCOUNT must be the bootstrap output apply_service_account")
          [[ "$TF_VAR_deploy_service_account" == "dx03v2-gha-deploy@$GCP_PROJECT_ID.iam.gserviceaccount.com" ]] || problems+=("LAB_DEPLOY_SERVICE_ACCOUNT must be the bootstrap output deploy_service_account")
          suffix="$(printf '%s' "$GCP_PROJECT_ID" | sha1sum | cut -c1-8)"
          [[ "$TF_STATE_BUCKET" == "tx03v2-tfstate-$suffix" ]] || problems+=("TF_STATE_BUCKET must be the bootstrap output state_bucket_name")
          [[ "$TF_VAR_app_deployer_members" =~ ^\[.*\]$ ]] || problems+=("LAB_APP_DEPLOYER_MEMBERS must be a JSON list, e.g. [\"user:you@example.com\"]")
          if ((${#problems[@]} > 0)); then
            printf '::error::Repository variable problem: %s\n' "${problems[@]}"
            echo "::error::Settings > Secrets and variables > Actions (the list of people is a secret, the rest variables); names and values in docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi
          # Identifiers never reach the logs of a public repository.
          number="${GCP_WORKLOAD_IDENTITY_PROVIDER#projects/}"
          for v in "$GCP_PROJECT_ID" "${number%%/*}" "$suffix"; do
            echo "::add-mask::$v"
          done

      - name: Mask the people of the operator in the logs
        env:
          MEMBERS: ${{ secrets.LAB_APP_DEPLOYER_MEMBERS }}
        run: |
          if [[ -n "$MEMBERS" ]]; then
            items="$(jq -r '.[]' <<<"$MEMBERS")"
            while IFS= read -r item; do
              [[ -n "$item" ]] || continue
              echo "::add-mask::$item"
              echo "::add-mask::${item#*:}"
            done <<<"$items"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '588.0.0'

      - name: Pre-flight (the project holds only the lab)
        run: bash scripts/preflight.sh --project "$GCP_PROJECT_ID"

      - name: Install terraform (pinned, SHA256-verified)
        run: |
          bash scripts/install-tools.sh terraform
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"

      - name: terraform init
        run: terraform -chdir=terraform/envs/lab init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=envs/lab"

      - name: terraform plan
        run: terraform -chdir=terraform/envs/lab plan -input=false -no-color -out=tfplan

      - name: Reviewed estimate, budget and expiration gate
        env:
          FINOPS_PRICING_JSON: ${{ vars.LAB_FINOPS_PRICING_JSON }}
          COST_BUDGET_USD: ${{ vars.LAB_COST_BUDGET_USD }}
          COST_HOURS: ${{ vars.LAB_COST_HOURS }}
          COST_EXPIRES_AT: ${{ vars.LAB_COST_EXPIRES_AT }}
        run: bash scripts/cost-workflow.sh gcp "$TF_VAR_region"

      - name: terraform apply
        run: terraform -chdir=terraform/envs/lab apply -input=false -no-color tfplan

      - name: Replicate the current credentials to the standby
        if: env.TF_VAR_db_profile == 'dr'
        run: |
          host="$(terraform -chdir=terraform/envs/lab output -raw dr_db_hostname)"
          bash scripts/sync-dr-secrets.sh --db-host "$host"

      - name: Outputs to the job summary (identifiers replaced)
        run: |
          number="${GCP_WORKLOAD_IDENTITY_PROVIDER#projects/}"
          number="${number%%/*}"
          suffix="$(printf '%s' "$GCP_PROJECT_ID" | sha1sum | cut -c1-8)"
          {
            echo "## terraform apply: terraform/envs/lab"
            echo '```'
            terraform -chdir=terraform/envs/lab output -no-color |
              sed -e "s/$GCP_PROJECT_ID/<PROJECT_ID>/g" -e "s/$number/<PROJECT_NUMBER>/g" -e "s/$suffix/<SUFFIX>/g"
            echo '```'
            echo "Next: dispatch the platform workflow (action=install), then the deploy-gcp workflow of dx03v2. Destroy when done."
          } >> "$GITHUB_STEP_SUMMARY"
