# Destroys the lab. CLOUD-MUTATING: requires the typed confirmation "destroy tx03v2-lab" and the
# `lab` environment approval. scripts/destroy.sh runs platform/uninstall.sh (if the cluster exists;
# the Gateway load balancer and its NEGs live outside the Terraform state), deletes through the API
# what the controller left when the uninstall fails, runs terraform destroy and always ends with
# scripts/leftovers.sh. Every step fails loudly; nothing is ignored. The bootstrap (APIs, state
# bucket, CI identities, budget) stays. Not run in the cloud yet (v2).
name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: destroy tx03v2-lab'
        required: true
        type: string
      force_unlock_id:
        description: 'Only after an interrupted apply or destroy: the lock ID of the Terraform error message (docs/RUNBOOK.md, section 8)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: tx03v2-lab-cloud
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_deploy_service_account: ${{ vars.LAB_DEPLOY_SERVICE_ACCOUNT }}
      # A secret, not a variable: the logs of a public repository are public, and a secret is masked.
      TF_VAR_app_deployer_members: ${{ secrets.LAB_APP_DEPLOYER_MEMBERS || '[]' }}
      TF_VAR_enable_waf: ${{ vars.LAB_ENABLE_WAF || 'true' }}
      TF_VAR_dns_zone_name: ${{ vars.LAB_DNS_ZONE_NAME || '' }}
      TF_VAR_app_domain_name: ${{ vars.LAB_APP_DOMAIN_NAME || '' }}
      TF_VAR_enable_managed_mesh: ${{ vars.LAB_ENABLE_MANAGED_MESH || 'false' }}
      TF_VAR_db_tier: ${{ vars.LAB_DB_TIER || 'db-g1-small' }}
      TF_VAR_db_profile: ${{ vars.LAB_DB_PROFILE || 'core' }}
      TF_VAR_continuity_notification_channels: ${{ vars.LAB_CONTINUITY_NOTIFICATION_CHANNELS || '[]' }}
      TF_VAR_active_region: ${{ vars.LAB_ACTIVE_REGION || 'primary' }}
      TF_VAR_ha_db_tier: ${{ vars.LAB_HA_DB_TIER || 'db-custom-1-3840' }}
      TF_VAR_db_backup_count: ${{ vars.LAB_DB_BACKUP_COUNT || 'null' }}
      TF_VAR_db_deletion_protection: ${{ vars.LAB_DB_DELETION_PROTECTION || 'false' }}
      TF_VAR_db_retain_backups_on_delete: ${{ vars.LAB_DB_RETAIN_BACKUPS_ON_DELETE || 'false' }}
      TF_VAR_dr_region: ${{ vars.LAB_DR_REGION || 'us-east1' }}
      TF_VAR_dr_nodes_subnet_cidr: ${{ vars.LAB_DR_NODES_SUBNET_CIDR || '10.40.0.0/20' }}
      TF_VAR_dr_pods_cidr: ${{ vars.LAB_DR_PODS_CIDR || '10.42.0.0/16' }}
      TF_VAR_dr_services_cidr: ${{ vars.LAB_DR_SERVICES_CIDR || '10.43.0.0/20' }}
      TF_VAR_dr_control_plane_cidr: ${{ vars.LAB_DR_CONTROL_PLANE_CIDR || '172.31.255.224/28' }}
    steps:
      - name: Check the confirmation and repository variables
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "destroy tx03v2-lab" ]]; then
            echo "::error::Confirmation mismatch: type exactly 'destroy tx03v2-lab'."
            exit 1
          fi
          problems=()
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || problems+=("GCP_PROJECT_ID must be the project ID given to the bootstrap")
          [[ "$REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || problems+=("GCP_REGION must be the region given to the bootstrap, e.g. us-central1")
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/tx03v2-github/providers/github$ ]] || problems+=("GCP_WORKLOAD_IDENTITY_PROVIDER must be the bootstrap output workload_identity_provider")
          [[ "$GCP_SERVICE_ACCOUNT" == "tx03v2-gha-apply@$GCP_PROJECT_ID.iam.gserviceaccount.com" ]] || problems+=("GCP_APPLY_SERVICE_ACCOUNT must be the bootstrap output apply_service_account")
          [[ "$TF_VAR_deploy_service_account" == "dx03v2-gha-deploy@$GCP_PROJECT_ID.iam.gserviceaccount.com" ]] || problems+=("LAB_DEPLOY_SERVICE_ACCOUNT must be the bootstrap output deploy_service_account")
          suffix="$(printf '%s' "$GCP_PROJECT_ID" | sha1sum | cut -c1-8)"
          [[ "$TF_STATE_BUCKET" == "tx03v2-tfstate-$suffix" ]] || problems+=("TF_STATE_BUCKET must be the bootstrap output state_bucket_name")
          [[ "$TF_VAR_app_deployer_members" =~ ^\[.*\]$ ]] || problems+=("LAB_APP_DEPLOYER_MEMBERS must be a JSON list, e.g. [\"user:you@example.com\"]")
          if ((${#problems[@]} > 0)); then
            printf '::error::Repository variable problem: %s\n' "${problems[@]}"
            echo "::error::Settings > Secrets and variables > Actions (the list of people is a secret, the rest variables); names and values in docs/RUNBOOK.md (section 'GitHub variables and secrets')."
            exit 1
          fi
          # Identifiers never reach the logs of a public repository.
          number="${GCP_WORKLOAD_IDENTITY_PROVIDER#projects/}"
          for v in "$GCP_PROJECT_ID" "${number%%/*}" "$suffix"; do
            echo "::add-mask::$v"
          done

      - name: Mask the people of the operator in the logs
        env:
          MEMBERS: ${{ secrets.LAB_APP_DEPLOYER_MEMBERS }}
        run: |
          if [[ -n "$MEMBERS" ]]; then
            items="$(jq -r '.[]' <<<"$MEMBERS")"
            while IFS= read -r item; do
              [[ -n "$item" ]] || continue
              echo "::add-mask::$item"
              echo "::add-mask::${item#*:}"
            done <<<"$items"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '588.0.0'
          install_components: gke-gcloud-auth-plugin

      - name: Install terraform, kubectl and helm (pinned, SHA256-verified)
        run: |
          bash scripts/install-tools.sh terraform kubectl helm
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"

      # One step on purpose: the script keeps going after a failed uninstall and always ends with the
      # leftover check (the order and the fallback are tested offline: check destroy-flow).
      - name: Destroy the platform layer and the lab, then check for leftovers
        env:
          FORCE_UNLOCK_ID: ${{ inputs.force_unlock_id }}
        run: |
          args=()
          if [[ -n "$FORCE_UNLOCK_ID" ]]; then
            args=(--force-unlock "$FORCE_UNLOCK_ID")
          fi
          bash scripts/destroy.sh --project "$GCP_PROJECT_ID" "${args[@]}"
