# Installs (or removes) the platform layer on the lab cluster. The optional full profile adds the
# pinned charts in platform/full/charts.txt and GitOps; the core profile stays the default. The GKE
# Gateway controller is managed by Google. CLOUD-MUTATING: dispatch manually after terraform-apply.
# Runs as tx03v2-gha-apply (roles/container.admin) through the IAM-only DNS endpoint. Not run in the
# cloud yet (v2).
name: platform

on:
  workflow_dispatch:
    inputs:
      target:
        description: Primary or independent secondary lab runtime (secondary requires DR profile)
        type: choice
        options: [primary, secondary]
        default: primary
      action:
        description: install or uninstall
        type: choice
        options:
          - install
          - uninstall
        default: install
      finops:
        description: Install configured OpenCost and recommendation-only VPA (full profile)
        type: boolean
        default: false
      profile:
        description: core or full (full installs the optional cloud platform charts)
        type: choice
        options:
          - core
          - full
        default: core

permissions:
  contents: read

concurrency:
  group: tx03v2-lab-cloud
  cancel-in-progress: false

jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ inputs.target == 'secondary' && vars.LAB_DR_REGION || vars.GCP_REGION }}
      # A secret, not a variable: the logs of a public repository are public, and a secret is masked.
      APP_DEPLOYER_MEMBERS: ${{ secrets.LAB_APP_DEPLOYER_MEMBERS || '[]' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PROFILE: ${{ inputs.profile }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check repository variables
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
        run: |
          problems=()
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || problems+=("GCP_PROJECT_ID must be the project ID given to the bootstrap")
          [[ "$REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || problems+=("GCP_REGION must be the region given to the bootstrap, e.g. us-central1")
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/tx03v2-github/providers/github$ ]] || problems+=("GCP_WORKLOAD_IDENTITY_PROVIDER must be the bootstrap output workload_identity_provider")
          [[ "$GCP_SERVICE_ACCOUNT" == "tx03v2-gha-apply@$GCP_PROJECT_ID.iam.gserviceaccount.com" ]] || problems+=("GCP_APPLY_SERVICE_ACCOUNT must be the bootstrap output apply_service_account")
          [[ "$APP_DEPLOYER_MEMBERS" =~ ^\[.*\]$ ]] || problems+=("LAB_APP_DEPLOYER_MEMBERS must be a JSON list, e.g. []")
          if ((${#problems[@]} > 0)); then
            printf '::error::Repository variable problem: %s\n' "${problems[@]}"
            echo "::error::Settings > Secrets and variables > Actions (the list of people is a secret, the rest variables); names and values in docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi
          # Identifiers never reach the logs of a public repository.
          number="${GCP_WORKLOAD_IDENTITY_PROVIDER#projects/}"
          for v in "$GCP_PROJECT_ID" "${number%%/*}"; do
            echo "::add-mask::$v"
          done

      - name: Mask the people of the operator in the logs
        env:
          MEMBERS: ${{ env.APP_DEPLOYER_MEMBERS }}
        run: |
          if [[ -n "$MEMBERS" ]]; then
            items="$(jq -r '.[]' <<<"$MEMBERS")"
            while IFS= read -r item; do
              [[ -n "$item" ]] || continue
              echo "::add-mask::$item"
              echo "::add-mask::${item#*:}"
            done <<<"$items"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '588.0.0'
          install_components: gke-gcloud-auth-plugin

      - name: Install kubectl and helm (pinned, SHA256-verified)
        run: bash scripts/install-tools.sh kubectl helm

      - name: Run platform/${{ inputs.action }}.sh
        env:
          ACTION: ${{ inputs.action }}
          FINOPS: ${{ inputs.finops }}
          FINOPS_PRICING_JSON: ${{ vars.LAB_FINOPS_PRICING_JSON }}
        run: |
          args=()
          if [[ "$ACTION" == install && "$FINOPS" == true ]]; then
            umask 077
            printf '%s\n' "$FINOPS_PRICING_JSON" > "$RUNNER_TEMP/finops-pricing.json"
            export FINOPS_PRICING_FILE="$RUNNER_TEMP/finops-pricing.json"
            args+=(--finops)
          fi
          case "$ACTION" in
            install) bash platform/install.sh --profile "$PROFILE" --github-owner "$GITHUB_REPOSITORY_OWNER" --target "$TARGET" "${args[@]}" ;;
            uninstall) bash platform/uninstall.sh --target "$TARGET" ;;
            *) echo "::error::unknown action: $ACTION"; exit 1 ;;
          esac
